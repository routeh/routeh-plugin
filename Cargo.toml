[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# The versions and features the router pins, so that the
# protocol crate builds the same here and there.
[workspace.dependencies]
routeh-plugin-protocol = { path = "crates/protocol" }
routeh-plugin-bundle = { path = "crates/bundle" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
# A manifest's `pattern`: linear in time, no backtracking, its compiled
# size bounded.
regex = { version = "1", default-features = false, features = ["std", "unicode"] }
# Signals (SIGTERM, SIGINT) for a plugin's service: nothing else.
libc = "0.2"
# The bundle's: ed25519 with the router's pin, and its archive.
ring = "=0.17.14"
tar = { version = "0.4", default-features = false }

# A plugin's service is small and static on the router.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

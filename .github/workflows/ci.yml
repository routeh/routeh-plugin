# Every push and pull request: rustfmt, clippy and the tests of every crate.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The toolchain of rust-toolchain.toml, rustfmt and clippy with it.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: make lint
      - run: make test

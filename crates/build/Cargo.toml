[package]
name = "routeh-plugin-build"
description = "Build, pack, sign and publish routeh router plugins: bundles, the feed, the OpenWrt SDK and QEMU"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"
# No unit tests inside the crate: its tests are tests/all.
test = false
doctest = false

# The same commands without a plugin's xtask: what the feed's workflow runs.
[[bin]]
name = "routeh-plugin"
path = "src/bin/routeh-plugin.rs"
test = false
doctest = false

[dependencies]
routeh-plugin-bundle.workspace = true
routeh-plugin-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

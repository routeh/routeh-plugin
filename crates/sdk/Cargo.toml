[package]
name = "routeh-plugin-sdk"
description = "Write a routeh router plugin's service as its converge: the channel, the system log, stopping and a test harness"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"
# No unit tests inside the crate: its tests are tests/all.
test = false
doctest = false

[dependencies]
routeh-plugin-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
toml.workspace = true

[[example]]
name = "minimal"
test = false

[[example]]
name = "records"
test = false
